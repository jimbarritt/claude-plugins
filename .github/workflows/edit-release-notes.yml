name: Edit release notes

# Manual only. One-off utility to rewrite an existing release's notes,
# e.g. to backfill a release published before the notes-generation step
# existed. Delete this workflow once it is no longer needed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to edit (e.g. swe-v0.9.0)"
        required: true
      notes:
        description: "New release notes (Markdown)"
        required: true

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --notes "$NOTES"
