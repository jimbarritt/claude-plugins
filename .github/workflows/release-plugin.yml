name: Release a plugin

# Manual only: run from the Actions tab, `gh workflow run`, or the
# GitHub API (`workflow_dispatch`). Reads the version straight out of
# the named plugin's own manifest, so there is nothing to type by hand
# beyond which plugin: bump the version in plugin.json first, then run
# this to tag and release that exact version.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin directory name (e.g. swe)"
        required: true
        default: "swe"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the plugin's version
        id: version
        run: |
          set -euo pipefail
          plugin="${{ inputs.plugin }}"
          manifest="$plugin/.claude-plugin/plugin.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest not found. Check the plugin name."
            exit 1
          fi
          version="$(jq -r '.version // empty' "$manifest")"
          if [ -z "$version" ]; then
            echo "::error::No .version field in $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${plugin}-v${version}" >> "$GITHUB_OUTPUT"

      - name: Refuse to re-release an existing tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists. Bump the version in ${{ inputs.plugin }}/.claude-plugin/plugin.json first."
            exit 1
          fi

      - name: Find this plugin's previous release tag
        id: prev_tag
        run: |
          set -euo pipefail
          prev="$(git tag -l '${{ inputs.plugin }}-v*' --sort=-v:refname | head -1)"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build release notes from the commit log
        # --generate-notes summarises merged PRs; this repo ships by
        # pushing straight to main, so that always comes back empty.
        # Build notes from git log instead, scoped to this plugin's own
        # directory so another plugin's commits don't show up here.
        id: notes
        run: |
          set -euo pipefail
          plugin="${{ inputs.plugin }}"
          prev="${{ steps.prev_tag.outputs.prev }}"
          notes_file="$(mktemp)"
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
            echo "## Changes in $plugin since $prev" >> "$notes_file"
          else
            range="HEAD"
            echo "## Changes in $plugin" >> "$notes_file"
          fi
          echo >> "$notes_file"
          git log "$range" --no-merges --pretty=format:'- %s (%h)' -- "$plugin/" >> "$notes_file"
          echo >> "$notes_file"
          if [ -n "$prev" ]; then
            echo >> "$notes_file"
            echo "**Full diff**: https://github.com/${{ github.repository }}/compare/${prev}...${{ steps.version.outputs.tag }}" >> "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ inputs.plugin }} v${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"
